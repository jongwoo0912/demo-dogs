spring.application.name=demo-dogs

# Actuator: health 엔드포인트만 웹으로 노출
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Kubernetes 스타일 liveness/readiness 프로브 (/actuator/health/liveness, /actuator/health/readiness)
management.endpoint.health.probes.enabled=true

# MySQL (접속 정보는 환경변수로 덮어쓸 수 있음)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbdemoboot}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}

# JPA
# update: 엔티티 기준으로 테이블 생성/변경 (데이터 유지). 운영에서는 validate + 마이그레이션 도구 권장
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
